{% extends "base.html" %}
{% block title %}{{ status_code }} — migration decision review{% endblock %}
{% block content %}
<div class="flex items-center justify-center px-6 py-20 text-center">
  <div class="max-w-md">
    <p class="text-xs font-semibold uppercase tracking-wide text-[#9A3412] mb-3">
      {{ 'Not found' if status_code == 404 else 'Something went wrong' }}
    </p>
    <p class="text-[15px] leading-relaxed text-[#3D3D38] mb-8">{{ detail }}</p>
    <a href="/" class="text-sm text-[#6B6B63] hover:text-[#171717] underline underline-offset-2">Back to upload</a>
  </div>
</div>
{% endblock %}
