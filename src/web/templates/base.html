<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Migration decision review{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrambleTextPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
  <script>
    // A visitor who has asked their OS for reduced motion gets the same
    // final state instantly instead of the animated path there — every
    // per-page script below checks this before touching gsap.
    window.prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (window.gsap) {
      gsap.registerPlugin(ScrollTrigger, SplitText, ScrambleTextPlugin, DrawSVGPlugin);
    }

    // Shared number counter: animates from 0 to endValue, formatted with
    // thousands separators (and, for money, two decimals) at every frame.
    // Falls back to setting the final text immediately if gsap didn't load
    // or motion is reduced, so the real figure is never gated on JS.
    window.gsapCountUp = function (el, endValue, opts) {
      opts = opts || {};
      var decimals = opts.decimals || 0;
      var format = function (v) {
        return v.toLocaleString("en-GB", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
      };
      if (window.prefersReducedMotion || !window.gsap) {
        el.textContent = format(endValue);
        return;
      }
      var obj = { val: 0 };
      gsap.to(obj, {
        val: endValue,
        duration: opts.duration || 1.3,
        delay: opts.delay || 0,
        ease: opts.ease || "power2.out",
        onUpdate: function () {
          el.textContent = format(obj.val);
        },
      });
    };

    // Headline word-reveal, shared by every page's #page-title except the
    // decision page (which uses a scramble-text reveal on already-visible
    // text instead — see decision.html). Splits into words and animates
    // them up from the CSS-hidden state declared below, so "the words are
    // not already there" is true from first paint, not a JS afterthought.
    window.gsapRevealTitle = function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      if (window.prefersReducedMotion || !window.gsap) {
        el.style.visibility = "visible";
        return;
      }
      if (window.SplitText) {
        var split = new SplitText(el, { type: "words" });
        el.style.visibility = "visible";
        gsap.from(split.words, { opacity: 0, y: 28, duration: 0.7, stagger: 0.08, ease: "power3.out" });
      } else {
        el.style.visibility = "visible";
        gsap.from(el, { opacity: 0, y: 28, duration: 0.7, ease: "power3.out" });
      }
    };
  </script>
  <style>
    /* Reserved for the things this tool exists to show: the question being
       asked and the figures behind it. Everything else (labels, nav, chrome)
       stays in the system sans, so the serif reads as a deliberate signal
       rather than a whole-page skin. */
    .font-serif-display {
      font-family: "Source Serif 4", Georgia, Cambria, "Times New Roman", Times, serif;
      font-optical-sizing: auto;
    }

    /* Entrance reveal, hidden from the very first paint via CSS (not a JS
       call that might run late enough to flash the content first). Scoped
       to no-preference so a reduced-motion visitor never has anything
       hidden behind a media query they didn't ask to depend on JS. */
    @media (prefers-reduced-motion: no-preference) {
      .reveal-title { visibility: hidden; }
      .reveal-item, .reveal-card { opacity: 0; transform: translateY(20px); }
    }
  </style>
</head>
<body>
  <div class="min-h-screen bg-[#FFFCE1] text-[#0E100F] font-sans antialiased flex flex-col">
    <header class="border-b border-[#E9E2B9] shrink-0">
      <div class="max-w-7xl mx-auto px-5 sm:px-8 py-4 flex items-center justify-between gap-4">
        <a href="/" class="text-sm font-semibold tracking-tight hover:text-[#726C4E] transition-colors">
          Migration decision review
        </a>
        <div class="flex items-center gap-4">{% block header_right %}{% endblock %}</div>
      </div>
    </header>
    <main class="flex-1">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
    // Guarantees .reveal-title/.reveal-item content is never stuck hidden if
    // gsap fails to load at all (blocked CDN, network issue, script error) --
    // this runs unconditionally, independent of whether any of the
    // per-page reveal scripts above ever fired. If they already ran, this
    // is a harmless no-op; if gsap never loaded, this rescues visibility
    // after a bounded wait instead of leaving the page blank forever.
    window.addEventListener("load", function () {
      setTimeout(function () {
        document.querySelectorAll(".reveal-title").forEach(function (el) {
          el.style.visibility = "visible";
        });
        document.querySelectorAll(".reveal-item").forEach(function (el) {
          el.style.opacity = "1";
          el.style.transform = "none";
        });
        // .reveal-card (the results-page blocking cards) is deliberately
        // scroll-triggered via ScrollTrigger.batch when gsap loaded
        // correctly, so it's only force-revealed here as a fallback for a
        // genuinely failed load -- not as a blanket timer, which would
        // otherwise defeat the scroll reveal for anything below the fold.
        if (!window.gsap || !window.ScrollTrigger) {
          document.querySelectorAll(".reveal-card").forEach(function (el) {
            el.style.opacity = "1";
            el.style.transform = "none";
          });
        }
      }, 1200);
    });
  </script>
</body>
</html>
