{% extends "base.html" %}
{% block title %}{{ status_code }} — migration decision review{% endblock %}
{% block content %}
<div class="flex items-center justify-center px-6 py-20 text-center">
  <div class="max-w-md">
    <p class="text-xs font-semibold uppercase tracking-wide text-[#0B7A2C] mb-3">
      {{ 'Not found' if status_code == 404 else 'Something went wrong' }}
    </p>
    <p class="text-[15px] leading-relaxed text-[#4A4530] mb-8">{{ detail }}</p>
    <a href="/" class="text-sm text-[#726C4E] hover:text-[#0E100F] underline underline-offset-2">Back to upload</a>
  </div>
</div>
{% endblock %}
